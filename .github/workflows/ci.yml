name: Backend release

on:
  pull_request:
  workflow_dispatch:
  push:
    # Build and deploy only when a tag is pushed; ordinary branch pushes skip CI.
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'market-kitchen-production' || format('market-kitchen-{0}', github.ref) }}
  queue: max

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_IMAGE: registry.cn-hangzhou.aliyuncs.com/node_caowj/market-kitchen

jobs:
  verify:
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Start the runner's preinstalled MySQL
        run: sudo systemctl start mysql.service
      - name: Run backend and MySQL tests
        working-directory: backend
        env:
          MARKET_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/?sslMode=DISABLED&allowPublicKeyRetrieval=true
          MARKET_TEST_MYSQL_USER: root
          MARKET_TEST_MYSQL_PASSWORD: root
        run: mvn -B -ntp verify

  build-and-push:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.deleted == false)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            tag="diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            tag=$GITHUB_REF_NAME
          fi
          printf 'ref=%s:%s\n' "$ACR_IMAGE" "$tag" >> "$GITHUB_OUTPUT"
      - name: Build and load backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.ref }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=market-kitchen
          cache-to: type=gha,mode=max,scope=market-kitchen
      - name: Check ACR connection
        shell: bash
        run: |
          curl --silent --show-error --output /dev/null --connect-timeout 8 --max-time 15 \
            --write-out 'ACR /v2/ HTTP %{http_code} DNS %{time_namelookup}s TCP %{time_connect}s TLS %{time_appconnect}s total %{time_total}s\n' \
            "https://$ACR_REGISTRY/v2/" || true
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Push backend image to ACR
        id: push
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          docker image inspect --format 'Image {{.Id}} ({{.Size}} bytes)' "$IMAGE_REF"

          push_image() {
            local ref=$1 attempt status
            for attempt in 1 2; do
              echo "Push $ref (attempt $attempt/2, timeout 5 minutes)"
              if timeout --kill-after=10s 5m docker push "$ref"; then
                return 0
              else
                status=$?
              fi
              echo "docker push exited with status $status"
              if [[ "$attempt" == 1 ]]; then
                sleep 5
              fi
            done
            return "$status"
          }

          push_image "$IMAGE_REF"
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            sha_ref="$ACR_IMAGE:sha-$GITHUB_SHA"
            docker tag "$IMAGE_REF" "$sha_ref"
            push_image "$sha_ref"
          fi

          digest=$(timeout --kill-after=5s 45s docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE_REF")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ACR confirmed $IMAGE_REF@$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the published image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          : "${DEPLOY_HOST:?Set DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY}"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          key_dir=$(mktemp -d)
          trap 'rm -f -- "$key_dir/key"; rmdir -- "$key_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$key_dir/key"
          chmod 600 "$key_dir/key"
          ssh_options=(-i "$key_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          remote() {
            ssh "${ssh_options[@]}" -p "$DEPLOY_SSH_PORT" -l "$DEPLOY_USER" -- "$DEPLOY_HOST" "$@"
          }

          stage=$(remote 'mktemp -d /opt/market-kitchen/.incoming.XXXXXXXX')
          [[ "$stage" =~ ^/opt/market-kitchen/\.incoming\.[A-Za-z0-9]+$ ]]
          cleanup() {
            remote "rm -f -- '$stage/compose.prod.yml' '$stage/image'; rmdir -- '$stage'" || true
            rm -f -- "$key_dir/key"
            rmdir -- "$key_dir"
          }
          trap cleanup EXIT

          scp "${ssh_options[@]}" -P "$DEPLOY_SSH_PORT" \
            compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$stage/"

          remote "cd /opt/market-kitchen && bash -se -- '$stage' '$ACR_IMAGE@$IMAGE_DIGEST'" <<'REMOTE'
          stage=$1
          export MARKET_IMAGE=$2
          printf '%s\n' "$MARKET_IMAGE" > "$stage/image"
          compose=(docker compose --project-directory "$PWD" --env-file .env -f "$stage/compose.prod.yml")
          mysql_image=$("${compose[@]}" config --images mysql)
          if ! mysql_image_id=$(docker image inspect --format '{{.Id}}' "$mysql_image" 2>/dev/null); then
            echo "Preload $mysql_image on the server before deploying." >&2
            exit 1
          fi
          old_mysql=$("${compose[@]}" ps --all --quiet mysql)
          if [[ -n "$old_mysql" && "$(docker inspect --format '{{.Image}}' "$old_mysql")" != "$mysql_image_id" ]]; then
            echo 'The preloaded MySQL image differs from the image of the existing MySQL container.' >&2
            exit 1
          fi
          "${compose[@]}" pull market

          # Stop an earlier combined container before handing its data volume to MySQL.
          old_app=$("${compose[@]}" ps --all --quiet market)
          legacy=false
          if [[ -n "$old_app" && -n "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/mysql"}}{{.Name}}{{end}}{{end}}' "$old_app")" ]]; then
            if [[ ! -f compose.prod.yml || ! -s .market-image ]]; then
              echo 'The existing combined release is missing its rollback configuration.' >&2
              exit 1
            fi
            mysql_version() {
              docker run --rm --pull never --network none --entrypoint mysqld "$1" --version |
                sed -nE 's/.* Ver ([0-9.]+).*/\1/p'
            }
            old_version=$(mysql_version "$(docker inspect --format '{{.Image}}' "$old_app")")
            new_version=$(mysql_version "$mysql_image")
            if [[ -z "$old_version" || "$old_version" != "$new_version" ]]; then
              echo "MySQL versions must match before switching the existing volume ($old_version -> $new_version)." >&2
              exit 1
            fi
            docker stop --timeout 45 "$old_app" >/dev/null
            legacy=true
          fi

          if ! "${compose[@]}" up -d --wait --wait-timeout 200 --pull never mysql \
            || ! "${compose[@]}" up -d --wait --wait-timeout 200 --pull never --no-deps market; then
            "${compose[@]}" ps -a || true
            if [[ -f compose.prod.yml && -s .market-image ]]; then
              echo 'Restoring the previous release.' >&2
              MARKET_IMAGE=$(<.market-image)
              previous_compose=(docker compose --env-file .env -f compose.prod.yml)
              if [[ "$legacy" == true ]]; then
                "${compose[@]}" stop mysql
              else
                "${previous_compose[@]}" up -d --wait --wait-timeout 200 --pull never mysql
              fi
              "${previous_compose[@]}" \
                up -d --wait --wait-timeout 200 --pull missing --no-deps market
            fi
            exit 1
          fi
          mv -f -- "$stage/compose.prod.yml" compose.prod.yml
          mv -f -- "$stage/image" .market-image
          docker compose --env-file .env -f compose.prod.yml ps
          REMOTE
