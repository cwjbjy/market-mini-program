name: Backend release

on:
  pull_request:
  push:
    # Build and deploy only when a tag is pushed; ordinary branch pushes skip CI.
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'market-kitchen-production' || format('market-kitchen-{0}', github.ref) }}
  queue: max

env:
  ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ACR_IMAGE: registry.cn-hangzhou.aliyuncs.com/node_caowj/market-kitchen

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Start the runner's preinstalled MySQL
        run: sudo systemctl start mysql.service
      - name: Run backend and MySQL tests
        working-directory: backend
        env:
          MARKET_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/?sslMode=DISABLED&allowPublicKeyRetrieval=true
          MARKET_TEST_MYSQL_USER: root
          MARKET_TEST_MYSQL_PASSWORD: root
        run: mvn -B -ntp verify

  build-and-push:
    if: github.event_name == 'push' && github.event.deleted == false
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Push backend image to ACR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_IMAGE }}:sha-${{ github.sha }}
            ${{ env.ACR_IMAGE }}:${{ github.ref_name }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=market-kitchen
          cache-to: type=gha,mode=max,scope=market-kitchen

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy the published image
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          envs: ACR_IMAGE,IMAGE_DIGEST
          script: |
            set -eu
            cd /opt/market-kitchen
            export COMPOSE_FILE=compose.prod.yml
            export MARKET_IMAGE="$ACR_IMAGE@${IMAGE_DIGEST:?Missing image digest}"

            docker compose up -d --wait --wait-timeout 200
            docker compose ps

            if current_id=$(docker image inspect --format '{{.Id}}' "$MARKET_IMAGE") &&
              images=$(docker image ls --digests --no-trunc --format '{{.Repository}} {{.Tag}} {{.Digest}} {{.ID}}' "$ACR_IMAGE"); then
              printf '%s\n' "$images" | while read -r repository tag digest image_id; do
                [ "$repository" = "$ACR_IMAGE" ] && [ "$image_id" != "$current_id" ] || continue
                containers=$(docker ps -aq --filter "ancestor=$image_id") || break
                [ -z "$containers" ] || continue

                if [ "$tag" != '<none>' ]; then
                  old_ref="$repository:$tag"
                elif [ "$digest" != '<none>' ]; then
                  old_ref="$repository@$digest"
                else
                  continue
                fi
                docker image rm --no-prune "$old_ref" ||
                  echo "Could not remove old backend image $old_ref." >&2
              done
            else
              echo 'Old backend image cleanup did not finish.' >&2
            fi
