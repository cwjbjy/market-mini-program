services:
  mysql:
    image: mysql:8.0
    command: ["mysqld", "--mysqlx=OFF"]
    environment:
      MYSQL_DATABASE: market_app
      MYSQL_USER: ${MARKET_MYSQL_USER:-market}
      MYSQL_PASSWORD: ${MARKET_MYSQL_PASSWORD:-market-local}
      MYSQL_ROOT_PASSWORD: ${MARKET_MYSQL_ROOT_PASSWORD:-market-root-local}
    ports:
      - "127.0.0.1:${MARKET_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      start_interval: 3s
      retries: 6

volumes:
  mysql_data:
