services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --norc
        - --quiet
        - mongodb://localhost:27017/admin?directConnection=true&serverSelectionTimeoutMS=2000
        - --eval
        - |
          try {
            rs.status();
          } catch (error) {
            if (error.code !== 94) throw error;
            const result = rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]});
            if (!result.ok) throw new Error(JSON.stringify(result));
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 3s
      retries: 6

volumes:
  mongo_data:
