server:
  port: ${MARKET_SERVER_PORT:8080}
spring:
  application:
    name: market-kitchen
  data:
    mongodb:
      uri: ${MARKET_MONGODB_URI:mongodb://localhost:27017/market_app?replicaSet=rs0}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
market:
  upload-dir: ${MARKET_UPLOAD_DIR:local/uploads}
